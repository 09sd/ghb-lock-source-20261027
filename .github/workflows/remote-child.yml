name: Remote lock child
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke-source:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke source action
        uses: 09sd/ghb-lock-source-20261027@main
      - name: Attacker moved workflow marker
        run: echo "GHB_REMOTE_WORKFLOW_MOVED_UNTRUSTED_20261027"
      - run: echo "GHB_REMOTE_CHILD_DONE_20261027"
